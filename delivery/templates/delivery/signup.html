{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Sign Up | MealMate
    </title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
          href="{% static 'delivery/style.css' %}">

    <style>

        body{

            background:var(--light-bg);
        }

        .auth-container{

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:40px 20px;
        }

        .auth-card{

            background:var(--white);

            padding:40px;

            border-radius:var(--radius-lg);

            box-shadow:var(--shadow-lg);

            width:100%;

            max-width:500px;

            text-align:center;
        }

        .auth-card .logo{

            font-size:2rem;

            margin-bottom:20px;

            justify-content:center;
        }

        .auth-card h3{

            margin-bottom:30px;

            color:var(--dark-text);
        }

        .form-group{

            margin-bottom:20px;

            text-align:left;
        }

        .form-group label{

            display:block;

            margin-bottom:8px;

            font-weight:500;

            color:var(--dark-text);
        }

        .form-group input,
        .form-group textarea,
        .form-group select{

            width:100%;

            padding:12px 15px;

            border:1px solid #ddd;

            border-radius:10px;

            font-size:1rem;
        }

        .form-group textarea{

            resize:vertical;

            min-height:80px;
        }

    </style>

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <a href="/"
           class="logo">

            <i class="fa-solid fa-burger"></i>

            Meal<span>Mate</span>

        </a>

        <h3>
            Create your account
        </h3>

        <form action="{% url 'signup' %}"
              method="post">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Select Role
                </label>

                <select name="role"
                        required>

                    <option value="customer">

                        Customer

                    </option>

                    <option value="manager">

                        Hotel Manager

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>
                    Username
                </label>

                <input type="text"
                       name="username"
                       required
                       placeholder="Choose a username">

            </div>

            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email"
                       name="email"
                       required
                       placeholder="Enter your email">

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input type="password"
                       name="password"
                       required
                       placeholder="Create password">

            </div>

            <div class="form-group">

                <label>
                    Mobile
                </label>

                <input type="text"
                       name="mobile"
                       required
                       placeholder="Enter mobile number">

            </div>

            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea name="address"
                          required
                          placeholder="Enter your address"></textarea>

            </div>

            <button type="submit"
                    class="btn btn-primary btn-block btn-glow">

                SIGN UP

            </button>

        </form>

        <p style="
            margin-top:20px;
            color:var(--light-text);
        ">

            Already have an account?

            <a href="{% url 'open_signin' %}"
               style="
               color:var(--primary-color);
               font-weight:600;">

                Sign In

            </a>

        </p>

    </div>

</div>

</body>

</html>
