{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurant | MealMate Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'delivery/style.css' %}">
    <style>
        .admin-form-container { padding: 120px 0 60px; min-height: 80vh; display: flex; justify-content: center; align-items: center; }
        .form-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
        .form-box h2 { text-align: center; margin-bottom: 30px; color: var(--text-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-color); }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 1rem; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2); }
        .btn-submit { width: 100%; padding: 14px; font-size: 1.1rem; margin-top: 10px; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo"><i class="fa-solid fa-burger"></i> Meal<span>Mate</span> Admin</a>
            <div class="nav-actions">
                <a href="{% url 'open_show_restaurant' %}" class="btn btn-outline" style="padding: 8px 16px;">Back to List</a>
            </div>
        </div>
    </header>

    <main class="admin-form-container">
        <div class="form-box">
            <h2>Update Restaurant</h2>
            <form action="{% url 'update_restaurant' restaurant.id %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Restaurant Name</label>
                    <input type="text" name="name" value="{{restaurant.name}}" required>
                </div>
                <div class="form-group">
                    <label>Picture URL</label>
                    <input type="text" name="picture" value="{{restaurant.picture}}" required>
                </div>
                <div class="form-group">
                    <label>Cuisine</label>
                    <input type="text" name="cuisine" value="{{restaurant.cuisine}}" required>
                </div>
                <div class="form-group">
                    <label>Rating</label>
                    <input type="number" name="rating" min="0" max="5" step="0.1" value="{{restaurant.rating}}" required>
                </div>
                <button type="submit" class="btn btn-primary btn-submit">Save Changes</button>
            </form>
        </div>
    </main>
</body>
</html>
